<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Report Maker</title>
<style>
:root{--bg:#eceff3;--pn:#fff;--tx:#1b2430;--mu:#5b6675;--bd:#cfd6df;--ac:#1d4ed8;--ab:#e8efff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--pn:#19212b;--tx:#e8edf3;--mu:#98a4b3;--bd:#2c3745;--ac:#7aa2ff;--ab:#22304d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--pn:#19212b;--tx:#e8edf3;--mu:#98a4b3;--bd:#2c3745;--ac:#7aa2ff;--ab:#22304d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}
aside{width:310px;flex:none;background:var(--pn);border-right:1px solid var(--bd);padding:14px;height:100vh;overflow-y:auto;position:sticky;top:0}
aside h1{font-size:17px;margin:0 0 10px}
aside h2{font-size:13px;margin:16px 0 6px;color:var(--mu);font-weight:600}
aside label{display:block;font-size:12px;color:var(--mu);margin:7px 0 2px}
aside input,aside select,aside textarea{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
aside textarea{resize:vertical;min-height:54px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:6px;padding:5px 10px}
button:hover{background:var(--ab)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
main{flex:1;min-width:0;overflow-x:auto;padding:20px 12px 60px}
.page{width:210mm;min-height:297mm;background:#fff;color:#000;margin:0 auto 22px;padding:18mm 20mm 22mm;position:relative;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.pn{position:absolute;bottom:8mm;left:0;right:0;text-align:center;font-size:.85em}
.pgbar{display:flex;justify-content:space-between;align-items:center;width:210mm;margin:0 auto 6px;color:var(--mu);font-size:12px}
.blk{position:relative;margin:0 0 .8em;border-radius:4px}
.blk:hover,.blk:focus-within{outline:1px dashed #6b8bd6;outline-offset:3px}
.tb{display:none;position:absolute;right:0;top:-30px;z-index:5;gap:4px;background:var(--pn);border:1px solid var(--bd);padding:3px;border-radius:7px;flex-wrap:nowrap;white-space:nowrap;color:var(--tx)}
.tb select,.tb input[type=range]{width:auto;font-size:12px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:5px}
.tb button{padding:2px 8px}
.blk:hover>.tb,.blk:focus-within>.tb{display:flex}
.ed{outline:none;min-height:1.4em;white-space:pre-wrap;text-align:justify}
.ed:empty:before{content:attr(data-ph);color:#9aa3af}
.hd{font-weight:700;font-size:1.25em}
.fig{margin:0;text-align:center}
.fig img{max-width:100%;display:block;margin:0 auto}
.fig .ed{text-align:center;font-size:.9em;margin-top:4px}
.up{border:2px dashed #9aa3af;padding:30px;color:#6b7280;border-radius:6px;background:#fff}
.ib{display:flex;gap:14px;align-items:flex-start}
.ib.c{flex-direction:column;align-items:stretch}
.ib>.ed{flex:1;min-width:0}
table{border-collapse:collapse;width:100%;margin-top:4px}
td,th{border:1px solid #000;padding:4px 7px;min-width:40px;outline:none;vertical-align:top}
th{background:#f1f1f1}
.tcap{text-align:center;font-weight:600;margin-bottom:2px}
.addbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:10px;border-top:1px dashed #bbb}
.addbar button{background:#fff;color:#222;border-color:#bbb}
.cv{text-align:left}
.cv .lg{display:block;margin:0 auto;height:34mm}
.cv .u{text-align:center;font-weight:700;font-size:1.15em;margin-top:4px}
.cv .d{text-align:center;font-weight:700;font-size:.75em}
.cv .ci{margin-top:16mm;line-height:1.5}
.cv .sb{margin-top:14mm}
.cv .nm{display:block;font-size:1.35em;font-family:Arial,Helvetica,sans-serif;margin-top:2px}
.cv .st{margin:36mm 0 0 55%;line-height:1.35}
.cv .st b{display:block;font-size:1.1em;font-family:Arial,Helvetica,sans-serif}
.cv .st small{display:block;font-size:.7em}
.mv{cursor:move;touch-action:none}.mv.sel{outline:1.5px dashed #2563eb;outline-offset:2px}.tb{font-size:13px}.cv .tn{font-weight:700;font-size:1.1em;font-family:Arial,Helvetica,sans-serif}.cv .sm{font-size:.7em}.cv .mb{margin-bottom:.6em}
@media (max-width:900px){.app{flex-direction:column}aside{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--bd)}}
@media print{html,body{background:#fff}aside,.pgbar,.addbar,.tb{display:none!important}main{padding:0;overflow:visible}.page{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:0;overflow:hidden;page-break-after:always}.blk{outline:none!important}.up{display:none}@page{size:A4;margin:0}}
</style></head>
<body>
<div class="app">
<aside>
<h1>Lab Report Maker</h1>
<div class="row"><button class="pri" id="pdf">Print / PDF save</button><button id="addp">+ Notun page</button></div>
<h2>Font</h2>
<label>Font family</label><select id="font"></select>
<label>Font size (pt)</label><input id="size" type="number" min="8" max="24" step="0.5">
<label><input id="pnum" type="checkbox" style="width:auto"> Page number dekhao</label>
<div class="row" id="fmt"></div>
<p style="font-size:11px;color:var(--mu);margin:4px 0 0">Text select kore B / I / U / align dao. Page er block e hover korle ✥ (drag kore move), A− A+ (size) ashbe.</p>
<h2>Report type</h2><select id="rt"><option value="lab">Lab report</option><option value="cep">CEP report</option><option value="other">Onno report</option></select><label><input id="grp" type="checkbox" style="width:auto"> Group report (onek member)</label><h2>Cover page</h2><p style="font-size:11px;color:var(--mu);margin:0 0 4px">Cover er jekono text/logo click kore drag koro, size niche theke change koro.</p><div class="row" style="align-items:center"><b id="spl" style="font-size:12px;max-width:110px;overflow:hidden;white-space:nowrap">(kichu select nai)</b><button id="szm">A−</button><input id="szv" type="number" style="width:64px"><button id="szp">A+</button><button id="szr">Reset</button></div><div id="mem"></div>
<div id="cf"></div>
<label>Logo change</label><input id="lgf" type="file" accept="image/*">
<div class="row"><button id="reset">Sob reset</button></div>
</aside>
<main>
<div id="cvp" class="page"></div>
<div id="pg"></div>
</main>
</div>

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function btn(t,fn,title){const b=el("button","",t);b.title=title||"";b.onclick=fn;return b}
function ed(html,cb,ph){const d=el("div","ed",html);d.contentEditable=true;d.dataset.ph=ph||"";d.oninput=()=>{cb(d.innerHTML);save()};return d}
function opt(sel,list,cur){list.forEach(([v,l])=>{const o=el("option","",l);o.value=v;if(v==cur)o.selected=true;sel.append(o)})}
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.85))};im.src=r.result};r.readAsDataURL(file)}
let sel=null;
const TF=k=>{const o=S.cs[k]||{};return (o.dx||o.dy)?`transform:translate(${o.dx||0}px,${o.dy||0}px);`:""};
function M(k,cls,html){const o=S.cs[k]||{};return `<div class="mv ${cls||""}${sel==k?" sel":""}" data-k="${k}" style="${o.fs?`font-size:${o.fs}pt;`:""}${TF(k)}">${html}</div>`}
function cover(){const c=S.cover,e=esc,L=S.type=="lab";
const logo=`<img class="mv lg${sel=="logo"?" sel":""}" data-k="logo" src="${S.logo}" alt="" style="height:${(S.cs.logo||{}).fs||34}mm;${TF("logo")}">`;
const mid=L?M("exp","","Experiment No: "+e(c.exp))+M("expt","",e(c.expTitle)):M("rt","",(S.type=="cep"?"CEP Report":"Report")+" Title: "+e(c.rtitle));
let by=M("byl","","Submitted By:");
if(S.group)by+=(c.gn?M("gn","",e(c.gn)):"")+S.members.map((m,i)=>M("m"+i,"mb",`<b class="nm">${e(m.name)}</b>ID: ${e(m.id)}`)).join("");
else by+=M("nm","",`<b class="nm">${e(c.name)}</b>`)+M("id","","ID:"+e(c.id));
$("#cvp").innerHTML=`<div class="cv">${logo}${M("uni","u",e(c.uni))}${M("dept","d",e(c.dept))}<div class="ci">${M("code","","Course Code: "+e(c.code))}${M("ct","","Course Title: "+e(c.title))}${mid}</div><div class="sb">${by}</div><div class="st">${M("tol","","Submitted To:")}${M("tn","tn",e(c.toName))}${M("td","sm",e(c.toDept))}${M("tu","sm",e(c.toUni))}</div></div>`;
$("#cvp").querySelectorAll(".mv").forEach(n=>{n.onpointerdown=ev=>{ev.preventDefault();const k=n.dataset.k;pick(k);const o=S.cs[k]=S.cs[k]||{},x0=ev.clientX-(o.dx||0),y0=ev.clientY-(o.dy||0);n.setPointerCapture(ev.pointerId);n.onpointermove=e2=>{o.dx=e2.clientX-x0;o.dy=e2.clientY-y0;n.style.transform=`translate(${o.dx}px,${o.dy}px)`};n.onpointerup=()=>{n.onpointermove=null;save()}}})}
function pick(k){sel=k;document.querySelectorAll("#cvp .mv").forEach(n=>n.classList.toggle("sel",n.dataset.k==k));const n=document.querySelector(`#cvp [data-k="${k}"]`);if(!n)return;$("#spl").textContent=k=="logo"?"Logo (mm)":n.textContent.slice(0,16);const o=S.cs[k]||{};$("#szv").value=k=="logo"?(o.fs||34):(o.fs||Math.round(parseFloat(getComputedStyle(n).fontSize)*7.5)/10)}
function setFs(v){if(!sel||!v)return;const o=S.cs[sel]=S.cs[sel]||{};o.fs=Math.max(4,Math.min(90,v));cover();pick(sel);save()}
function form(){const f=$("#cf");f.innerHTML="";const T=S.type;
CF.forEach(([k,l,g])=>{if((g=="lab"&&T!="lab")||(g=="non"&&T=="lab")||(g=="grp"&&!S.group)||(g=="ind"&&S.group))return;const i=k=="expTitle"?el("textarea"):el("input");i.value=S.cover[k];i.oninput=()=>{S.cover[k]=i.value;cover();save()};f.append(el("label","",l),i)});
const m=$("#mem");m.innerHTML="";if(S.group){S.members.forEach((x,i)=>{const r=el("div","row"),a=el("input"),b=el("input");a.placeholder="Name";b.placeholder="ID";a.value=x.name;b.value=x.id;a.style.cssText=b.style.cssText="flex:1;min-width:0;width:auto";a.oninput=()=>{x.name=a.value;cover();save()};b.oninput=()=>{x.id=b.value;cover();save()};r.append(a,b,btn("✕",()=>{if(S.members.length>1){S.members.splice(i,1);form();cover();save()}}));m.append(r)});m.append(btn("+ Member",()=>{S.members.push({name:"",id:""});form();cover();save()}))}}
function coverOld(){const c=S.cover,e=esc;$("#cvp").innerHTML=`<div class="cv"><img class="lg" src="${S.logo}" alt=""><div class="u">${e(c.uni)}</div><div class="d">${e(c.dept)}</div><div class="ci"><div>Course Code: ${e(c.code)}</div><div>Course Title: ${e(c.title)}</div><div>Experiment No: ${e(c.exp)}</div><div>${e(c.expTitle)}</div></div><div class="sb">Submitted By:<b class="nm">${e(c.name)}</b><div>ID:${e(c.id)}</div></div><div class="st">Submitted To:<b>${e(c.toName)}</b><small>${e(c.toDept)}</small><small>${e(c.toUni)}</small></div></div>`}
function look(){const m=$("#cvp").style,p=$("#pg").style;[m,p].forEach(s=>{s.fontFamily=S.font;s.fontSize=S.size+"pt"});$("#pg").querySelectorAll(".page").forEach(x=>{x.style.fontFamily=S.font;x.style.fontSize=S.size+"pt"})}
function mv(p,i,d){const a=S.pages[p].blocks,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}
function add(p,t){const B={text:{t:"text",h:""},h:{t:"h",h:""},img:{t:"img",src:"",cap:"Fig: ",h:"",l:"pt",w:70},tbl:{t:"tbl",cap:"Table: ",c:[["Parameter","Value"],["",""],["",""]]}};S.pages[p].blocks.push(JSON.parse(JSON.stringify(B[t])));render()}
function blockEl(p,i){
const b=S.pages[p].blocks[i],w=el("div","blk"),tb=el("div","tb");
const ap=()=>{w.style.fontSize=b.fs?b.fs+"pt":"";w.style.transform=(b.dx||b.dy)?`translate(${b.dx||0}px,${b.dy||0}px)`:""};ap();
const fz=d=>()=>{b.fs=Math.max(6,Math.min(60,(b.fs||S.size)+d));ap();save()};
const hd=btn("✥",()=>{},"Drag kore move (double click = reset)");hd.style.cssText="cursor:move;touch-action:none";
hd.onpointerdown=ev=>{ev.preventDefault();const x0=ev.clientX-(b.dx||0),y0=ev.clientY-(b.dy||0);hd.setPointerCapture(ev.pointerId);hd.onpointermove=e=>{b.dx=e.clientX-x0;b.dy=e.clientY-y0;ap()};hd.onpointerup=()=>{hd.onpointermove=null;save()}};
hd.ondblclick=()=>{b.dx=b.dy=0;ap();save()};
tb.append(hd,btn("A−",fz(-1),"Font choto"),btn("A+",fz(1),"Font boro"),btn("↑",()=>mv(p,i,-1),"Upore"),btn("↓",()=>mv(p,i,1),"Niche"));
let body;
if(b.t=="text"||b.t=="h"){body=ed(b.h,v=>b.h=v,b.t=="h"?"Heading...":"Likho...");if(b.t=="h")body.classList.add("hd")}
else if(b.t=="img"){
const sel=el("select");opt(sel,[["pt","Pic upore, text niche"],["tp","Text upore, pic niche"],["l","Pic left, text right"],["r","Text left, pic right"]],b.l);sel.onchange=()=>{b.l=sel.value;render()};
const rg=el("input");rg.type="range";rg.min=20;rg.max=100;rg.value=b.w;rg.title="Pic size";
tb.prepend(sel,rg);
const fig=el("figure","fig");fig.style.width=b.w+"%";if(b.l=="l"||b.l=="r")fig.style.flex="none";
rg.oninput=()=>{b.w=+rg.value;fig.style.width=b.w+"%";save()};
const fi=el("input");fi.type="file";fi.accept="image/*";fi.hidden=true;fi.onchange=()=>{if(fi.files[0])shrink(fi.files[0],u=>{b.src=u;render()})};
if(b.src){const im=el("img");im.src=b.src;im.alt="";im.onclick=()=>fi.click();im.title="Click kore pic change";fig.append(im)}
else{const u=el("div","up","Pic upload korte click koro");u.onclick=()=>fi.click();fig.append(u)}
fig.append(fi,ed(b.cap,v=>b.cap=v,"Caption"));
const tx=ed(b.h,v=>b.h=v,"Pic er text (optional)");
body=el("div","ib"+(b.l=="pt"||b.l=="tp"?" c":""));
if(b.l=="pt"||b.l=="l")body.append(fig,tx);else body.append(tx,fig);
if(b.l=="pt"||b.l=="tp")fig.style.margin="0 auto";
}
else if(b.t=="tbl"){
const R=()=>render();
tb.prepend(btn("+Row",()=>{b.c.push(b.c[0].map(()=>""));R()}),btn("−Row",()=>{if(b.c.length>1){b.c.pop();R()}}),btn("+Col",()=>{b.c.forEach(r=>r.push(""));R()}),btn("−Col",()=>{if(b.c[0].length>1){b.c.forEach(r=>r.pop());R()}}));
body=el("div");const cap=ed(b.cap,v=>b.cap=v,"Table caption");cap.className="ed tcap";
const t=el("table");b.c.forEach((r,ri)=>{const tr=el("tr");r.forEach((c,ci)=>{const td=el(ri?"td":"th","",c);td.contentEditable=true;td.oninput=()=>{b.c[ri][ci]=td.innerHTML;save()};tr.append(td)});t.append(tr)});
body.append(cap,t)}
tb.append(btn("✕",()=>{S.pages[p].blocks.splice(i,1);render()},"Delete"));
w.append(tb,body);return w}
function pages(){const root=$("#pg");root.innerHTML="";
S.pages.forEach((pg,p)=>{
const bar=el("div","pgbar",`<span>Page ${p+1}</span>`);bar.append(btn("Page delete",()=>{if(S.pages.length>1&&confirm("Ei page delete korbe?")){S.pages.splice(p,1);render()}}));
const page=el("div","page");pg.blocks.forEach((_,i)=>page.append(blockEl(p,i)));
const ab=el("div","addbar");ab.append(btn("+ Text",()=>add(p,"text")),btn("+ Heading",()=>add(p,"h")),btn("+ Picture",()=>add(p,"img")),btn("+ Table",()=>add(p,"tbl")));page.append(ab);
if(S.pnum)page.append(el("div","pn",String(p+2)));
root.append(bar,page)});look()}
function render(){cover();pages();save()}
function init(){
const f=$("#font");opt(f,FONTS.map(([n,v])=>[v,n]),S.font);f.onchange=()=>{S.font=f.value;look();save()};
const sz=$("#size");sz.value=S.size;sz.oninput=()=>{S.size=+sz.value||12;look();save()};
const pn=$("#pnum");pn.checked=S.pnum;pn.onchange=()=>{S.pnum=pn.checked;render()};
[["B","bold"],["I","italic"],["U","underline"],["⇤","justifyLeft"],["≡","justifyCenter"],["⇥","justifyRight"],["☰","justifyFull"]].forEach(([l,c])=>{const b=btn(l,()=>document.execCommand(c));b.onmousedown=e=>e.preventDefault();$("#fmt").append(b)});
form();
const rt=$("#rt");rt.value=S.type;rt.onchange=()=>{S.type=rt.value;form();cover();save()};
const gp=$("#grp");gp.checked=S.group;gp.onchange=()=>{S.group=gp.checked;form();cover();save()};
$("#szm").onclick=()=>setFs((+$("#szv").value||12)-1);$("#szp").onclick=()=>setFs((+$("#szv").value||12)+1);$("#szv").onchange=()=>setFs(+$("#szv").value);
$("#szr").onclick=()=>{if(sel){delete S.cs[sel];cover();pick(sel);save()}};
$("#lgf").onchange=e=>{if(e.target.files[0])shrink(e.target.files[0],u=>{S.logo=u;cover();save()})};
$("#addp").onclick=()=>{S.pages.push({blocks:[{t:"text",h:""}]});render();scrollTo(0,document.body.scrollHeight)};
$("#pdf").onclick=()=>print();
$("#reset").onclick=()=>{if(confirm("Sob kichu muche abar shuru korbe?")){S=def();try{localStorage.removeItem("labrep1")}catch(e){}location.reload()}};
render()}
init();
</script></body></html>
